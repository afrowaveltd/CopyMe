name: CopyMe safety and Windows build

on:
  push:
    branches:
      - main
      - fix/windows-disk-safety-protocol-20261106
  pull_request:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run all cross-platform tests (including Windows wire protocols)
        run: dotnet run --project tests/Afrowave.DiskMigrator.Tests/Afrowave.DiskMigrator.Tests.csproj -c Release --no-launch-profile
      - name: Parse Windows VHDX integration script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "tools/windows-vm-test/Invoke-DiskMigrationTest.ps1"),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Publish Windows x64 self-contained executable (compile check)
        run: dotnet publish src/Afrowave.DiskMigrator.Cli/Afrowave.DiskMigrator.Cli.csproj -c Release -r win-x64 --self-contained true -o dist --nologo
